services:
  - type: web
    name: fragilee-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: ENV
        value: prod
      - key: FRAGILEE_ENV
        value: public
      - key: FRAGILEE_PUBLIC_SUPABASE_PROJECT_REF
        value: ayrxcjlonouqluysnhlg
      - key: STORAGE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
